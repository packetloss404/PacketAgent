name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build:web

      # The inherited warning baseline was reduced to zero, so lint is a hard
      # gate: any new error OR warning fails the build.
      - name: Lint
        run: npm run lint

      # The repository is fully Prettier-formatted, so formatting is a hard
      # gate. Run `npm run format` locally if this fails.
      - name: Check formatting
        run: npm run format:check

  browser:
    name: Authenticated browser end-to-end gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the web bundle and server, then drives the real built workbench
      # through sign-in, Builder app + agent modes, the command palette, the
      # canonical Worker operations workbench, all twelve Admin surfaces, and
      # legacy Admin redirects, asserting a clean console throughout.
      - name: Run browser gate
        run: npm run verify:workbench-browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-evidence
          path: tmp/release-verification/
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t packetagent:ci .
